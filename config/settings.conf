# 守护进程参数（shell 语法）。改完执行 acc_ctl apply 立即生效；
# 常驻进程的轮询节奏在下次开机或手动重启进程后生效。

# 开机后快速轮询的间隔（秒）。HyperOS 的安全中心/省电策略一般在开机后一两分钟内动手。
POLL_FAST=3

# 稳定期的轮询间隔（秒）。60 秒 = 一天 1440 次检查，耗电可以忽略；
# 想要更快发现被关（代价是更多唤醒）可以改成 15~30。
POLL_SLOW=60

# 开机后多少秒内使用快速轮询
BOOT_FAST_SECONDS=180

# 修复成功后额外快查多少次（防止安全中心连续补刀）
BOOST_TICKS=10

# STRICT=1 时，系统里的无障碍服务被强制改成"只保留 targets.txt 中的条目"，
# 其它应用的无障碍服务会被移除。默认 0 = 只往列表里补，不动别人的。
STRICT=0

# 日志详细程度：0 = 只记"服务被移除 / 已恢复 / 恢复失败"这类事件与错误
#               1 = 额外记录进程启动、新启用、每次恢复的完整明细（排查时才开）
VERBOSE=0
