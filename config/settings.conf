# 守护进程参数（shell 语法）。改完执行 acc_ctl apply 立即生效；
# 常驻进程的轮询节奏在下次开机或手动重启进程后生效。

# 开机后快速轮询的间隔（秒）。HyperOS 的安全中心/省电策略一般在开机后一两分钟内动手。
POLL_FAST=3

# 稳定期的轮询间隔（秒）。60 秒 = 一天 1440 次检查，耗电可以忽略；
# 想要更快发现被关（代价是更多唤醒）可以改成 15~30。
POLL_SLOW=60

# 开机后多少秒内使用快速轮询
BOOT_FAST_SECONDS=180

# 修复成功后额外快查多少次（防止安全中心连续补刀）
BOOST_TICKS=10

# 兼容旧版字段：守护及点检始终只补回 targets.txt 中选定的服务，
# 无论此值如何，均保留系统中其它已开启的无障碍服务。
STRICT=0

# 日志详细程度：0 = 记启动/退出/服务被移除/恢复成功失败/心跳这类关键事件
#               1 = 额外记录每轮巡检摘要、写入前后的完整列表（排查时才开）
VERBOSE=0

# 心跳日志间隔（秒）：每这么久写一条 ♥ 存活记录（运行时长、检查次数、修复次数）。
# 0 = 关闭心跳。怀疑"守护还在不在跑"或者查耗电时，先看这条。
HEARTBEAT_SECONDS=1800

# 单轮检查超过多少毫秒额外记一条"检查偏慢"日志（0 = 不记）
SLOW_TICK_MS=3000
